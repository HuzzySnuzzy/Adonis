<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>ADONIS – geen verbinding</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0806; color: #f4e4cf; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: min(480px, calc(100vw - 32px)); padding: 30px; background: rgba(16, 10, 6, .9); border: 1px solid rgba(255, 166, 48, .3); border-left: 3px solid #ff8a73; border-radius: 3px; }
    h1 { margin: 0 0 8px; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: #ffe2bd; }
    p { margin: 0 0 6px; color: #c9b096; }
    code { color: #4fe3d6; }
    .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    button { padding: 10px 16px; font: 700 12.5px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; border-radius: 2px; cursor: pointer; border: 1px solid rgba(255, 166, 48, .55); background: transparent; color: #f4e4cf; }
    button.primary { background: #ffa21f; color: #140a03; border-color: #ffa21f; }
    .small { font-size: 12px; color: #8f7a62; margin-top: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Geen verbinding met ADONIS</h1>
    <p>De server op <code id="url"></code> antwoordt niet.</p>
    <p id="err" class="small"></p>
    <p>Staat de server aan, en is deze computer verbonden met het netwerk/internet?</p>
    <div class="row">
      <button class="primary" id="retry">Opnieuw proberen</button>
      <button id="change">Adres wijzigen</button>
    </div>
    <p class="small" id="auto">Automatisch opnieuw proberen over <span id="sec">15</span> s…</p>
  </main>
  <script src="offline.js"></script>
</body>
</html>
