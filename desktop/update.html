<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>ADONIS bijwerken</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6e8eb; user-select: none; }
    .toast { position: absolute; inset: 6px; display: flex; gap: 12px; padding: 12px 14px; box-sizing: border-box; border-radius: 10px;
      background: #1a1d22; border: 1px solid #2e333b; box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
    .icon { flex: 0 0 auto; width: 30px; height: 30px; }
    .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .title { flex: 0 0 auto; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { color: #9aa1ab; font-size: 12px; }
    .bar { height: 6px; border-radius: 3px; background: #2e333b; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3d5be0, #6b8cff); transition: width .25s; }
    .bar.indeterminate i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
    button { font: 600 12.5px system-ui, sans-serif; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #3a404a; background: #23272e; color: #e6e8eb; }
    button:hover { background: #2b3038; }
    button.primary { background: #3c5bdc; border-color: #3c5bdc; color: #fff; }
    button.primary:hover { background: #4d6be8; }
    .close { position: absolute; top: 6px; right: 8px; padding: 0 6px; border: 0; background: none; color: #9aa1ab; font-size: 16px; line-height: 1; }
    .close:hover { background: none; color: #fff; }
    [hidden] { display: none !important; }
    .err .title { color: #ffb1a8; }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2a46c7"/><path d="M32 12 14 52h9l3.6-9h10.8l3.6 9h9L32 12zm-2.9 23L32 27.6 34.9 35h-5.8z" fill="#fff"/><rect x="22" y="38" width="20" height="4" rx="2" fill="#e2b44b"/></svg>
    <div class="body">
      <div class="title" id="title">ADONIS bijwerken…</div>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <div class="sub" id="sub"></div>
      <div class="row" id="ask" hidden>
        <button id="later">Later</button>
        <button class="primary" id="restart">Nu opnieuw starten</button>
      </div>
    </div>
    <button class="close" id="close" title="Verbergen (het bijwerken gaat door)" aria-label="Verbergen">×</button>
  </div>
  <script src="update.js"></script>
</body>
</html>
