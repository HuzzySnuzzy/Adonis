name: Build executables

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Maak een release met deze tag (bijv. v1.0.0). Leeg = alleen bouwen.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: win-x64
            exe: werkopdrachten.exe
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64
            exe: werkopdrachten-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build -- ${{ matrix.targets }}
        env:
          # Versienummer in het programma = release-tag (nodig voor automatisch bijwerken)
          RELEASE_VERSION: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

      - name: Test automatisch bijwerken
        shell: bash
        env:
          RELEASE_VERSION: v0.0.1
        run: |
          # Maak een "oude" versie en laat die bijwerken naar de zojuist gebouwde versie.
          EXE=${{ matrix.exe }}
          NEW_VERSION=$(./dist/$EXE --version)
          mkdir -p "$RUNNER_TEMP/new" "$RUNNER_TEMP/old"
          cp "dist/$EXE" "$RUNNER_TEMP/new/$EXE"
          npm run build -- ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}
          cp "dist/$EXE" "$RUNNER_TEMP/old/$EXE"
          cp "$RUNNER_TEMP/new/$EXE" "dist/$EXE"
          node scripts/test-update.js "$RUNNER_TEMP/old/$EXE" "$RUNNER_TEMP/new/$EXE" "$NEW_VERSION"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir smoke && cp dist/${{ matrix.exe }} smoke/ && cd smoke
          ./${{ matrix.exe }} --version
          ./${{ matrix.exe }} create-user test "Test" geheim123 --admin
          ./${{ matrix.exe }} --port 3123 < /dev/null > out.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:3123/login > login.html && break; sleep 1; done
          cat out.log
          grep -q "Inloggen" login.html
          curl -sf http://localhost:3123/static/css/werkopdracht.css > /dev/null
          test -f config.properties && test -d data

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Copy-Item dist/${{ matrix.exe }} smoke/
          Set-Location smoke
          ./${{ matrix.exe }} --version
          ./${{ matrix.exe }} create-user test "Test" geheim123 --admin
          if ($LASTEXITCODE -ne 0) { throw "create-user failed" }
          $p = Start-Process -FilePath ./${{ matrix.exe }} -ArgumentList '--port','3123','--open-browser','false' -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://localhost:3123/login; if ($r.Content -match 'Inloggen') { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          Get-Content out.log, err.log
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw 'Server did not respond' }
          if (-not (Test-Path config.properties)) { throw 'config.properties missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: werkopdrachten-${{ runner.os }}
          path: dist/werkopdrachten*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Werkopdrachten ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            artifacts/werkopdrachten*
            pterodactyl/egg-werkopdrachten.json
          generate_release_notes: true
